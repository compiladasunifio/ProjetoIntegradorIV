<mat-toolbar class="barra">
  <a class="marca" routerLink="/">
  <img src="logo.png" alt="UniFood" class="logo-img">
</a>

  <nav class="links">
    <a mat-button routerLink="/" routerLinkActive="ativo"
       [routerLinkActiveOptions]="{ exact: true }">Início</a>
    <a mat-button routerLink="/catalogo" routerLinkActive="ativo">Catálogo</a>

    @if (auth.logado()) {
      <a mat-button routerLink="/produtos/painel" routerLinkActive="ativo">Painel</a>
      <a mat-button routerLink="/produtos/meus-produtos" routerLinkActive="ativo">Meus produtos</a>
      <a mat-button routerLink="/produtos/cadastro" routerLinkActive="ativo">Novo produto</a>
    }
  </nav>

  <span class="espaco"></span>

  @if (auth.logado()) {
    <a mat-button class="usuario" routerLink="/vendedores/perfil" routerLinkActive="ativo">
      Olá, {{ auth.vendedor()?.nome }}
    </a>
    <button mat-button type="button" (click)="sair()">Sair</button>
  } @else {
    <a mat-button routerLink="/vendedores/login">Entrar</a>
    <a mat-flat-button routerLink="/vendedores/cadastro">Quero vender</a>
  }
</mat-toolbar>

<div class="conteudo">
  <router-outlet></router-outlet>
</div>

<footer class="rodape">
  <strong>UniFood</strong>
  <span>Projeto Integrador IV</span>
  <span>Feito por alunos, para a comunidade acadêmica.</span>
</footer>
