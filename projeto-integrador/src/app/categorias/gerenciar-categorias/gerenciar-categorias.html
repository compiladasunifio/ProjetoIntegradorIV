<main class="pagina">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Categorias</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form class="linha" (ngSubmit)="salvar()">
        <mat-form-field appearance="outline">
          <mat-label>{{ editandoId === null ? 'Nova categoria' : 'Editar categoria' }}</mat-label>
          <input matInput name="nome" required [(ngModel)]="nome">
        </mat-form-field>
        <button mat-flat-button type="submit">{{ editandoId === null ? 'Adicionar' : 'Salvar' }}</button>
        @if (editandoId !== null) {
          <button mat-button type="button" (click)="cancelar()">Cancelar</button>
        }
      </form>

      @if (mensagem()) {
        <p>{{ mensagem() }}</p>
      }

      <ul>
        @for (c of categorias(); track c.id) {
          <li>
            <span>{{ c.nome }}</span>
            <button mat-button type="button" (click)="editar(c)">Editar</button>
            <button mat-button type="button" (click)="excluir(c)">Excluir</button>
          </li>
        } @empty {
          <li>Nenhuma categoria cadastrada.</li>
        }
      </ul>
    </mat-card-content>
  </mat-card>
</main>
