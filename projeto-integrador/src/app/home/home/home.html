<main class="pagina">
  <section class="hero">
    <h1>UniFood</h1>
    <p>O espaço dos pequenos empreendedores da nossa faculdade para divulgar seus produtos, de forma simples e independente.</p>
    <div class="acoes">
      <a mat-flat-button routerLink="/catalogo">Ver catálogo</a>
      <a mat-button routerLink="/vendedores/cadastro">Quero vender</a>
    </div>
  </section>

  <section>
    <h2>Como funciona</h2>
    <div class="passos">
      @for (p of passos; track p.titulo) {
        <mat-card appearance="outlined">
          <mat-card-header>
            <mat-card-title>{{ p.titulo }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>{{ p.texto }}</mat-card-content>
        </mat-card>
      }
    </div>
  </section>
</main>
